<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DWD - Batch Color Processor</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: monospace;
      background: #f5f5f5;
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      margin: 0 auto;
    }

    h1 {
      font-size: 1.5rem;
      margin-bottom: 1rem;
    }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }

    .input-group {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 1rem;
    }

    .input-group input, .input-group select, .input-group button {
      padding: 0.5rem 1rem;
      font-size: 0.9rem;
    }

    .options {
      margin: 1rem 0;
      padding: 1rem;
      background: #f9f9f9;
      border-radius: 8px;
    }

    .options label {
      display: block;
      margin-bottom: 0.5rem;
    }

    .options input {
      margin-right: 0.5rem;
    }

    .progress {
      margin: 1rem 0;
      font-size: 0.9rem;
    }

    progress {
      width: 100%;
      height: 20px;
    }

    .preview {
      margin-top: 1rem;
      max-height: 300px;
      overflow-y: auto;
      font-size: 0.8rem;
      background: #f0f0f0;
      padding: 0.5rem;
      border-radius: 8px;
    }

    .preview pre {
      white-space: pre-wrap;
      word-break: break-all;
    }

    button {
      cursor: pointer;
    }

    .stats {
      margin-top: 1rem;
      padding: 0.5rem;
      background: #e8f5e9;
      border-radius: 8px;
    }
  </style>
</head>
<body>
<div class="container">
  <h1>DWD Batch Color Processor</h1>

  <div class="panel">
    <h2>Input JSON</h2>
    <div class="input-group">
      <input type="file" id="json-file" accept=".json">
      <button id="process-btn" disabled>Process</button>
    </div>

    <div class="options">
      <label>
        <input type="checkbox" id="generate-dates" checked> Generate dates if missing
      </label>
      <label>
        <input type="checkbox" id="preserve-dates" checked> Preserve original dates
      </label>
      <label>
        Force color space:
        <select id="force-space">
          <option value="auto">Auto (random per word)</option>
          <option value="RGB">RGB</option>
          <option value="HSL">HSL</option>
          <option value="LAB">LAB</option>
          <option value="YUV">YUV</option>
          <option value="YIQ">YIQ</option>
        </select>
      </label>
      <label>
        Start date for missing dates:
        <input type="date" id="start-date" value="2024-01-01">
      </label>
    </div>

    <div id="progress-area" style="display: none;">
      <div class="progress">
        <progress id="progress-bar" value="0" max="100"></progress>
        <span id="progress-text">0 / 0</span>
      </div>
    </div>

    <div id="preview" class="preview" style="display: none;">
      <h3>Preview (first 5 entries)</h3>
      <pre id="preview-content"></pre>
    </div>

    <div id="stats" class="stats" style="display: none;"></div>

    <button id="download-btn" disabled>Download Output JSON</button>
  </div>
</div>

<script src="../js/dwd-core.js"></script>
<script>
  // Initialize calculator
  const strategies = [
    new RgbStrategy(),
    new HslStrategy(),
    new LabStrategy(),
    new YuvStrategy(),
    new YiqStrategy()
  ];
  const calculator = new ColorCalculator(strategies);
  const storage = new DiaryStorage(); // For date helpers, but we won't save

  let currentEntries = [];
  let currentOutput = null;

  // Helper: get strategy by name
  function getStrategyByName(name) {
    switch (name) {
      case 'RGB': return new RgbStrategy();
      case 'HSL': return new HslStrategy();
      case 'LAB': return new LabStrategy();
      case 'YUV': return new YuvStrategy();
      case 'YIQ': return new YiqStrategy();
      default: return null;
    }
  }

  // Process entries
  async function processEntries(entries, forceSpaceName, startDate, generateDates, preserveDates) {
    const output = [];
    let currentDate = new Date(startDate);

    for (let i = 0; i < entries.length; i++) {
      const item = entries[i];
      if (!item.word || item.word.trim() === '') continue;

      const word = item.word.trim();
      let date = null;

      // Determine date
      if (item.date && preserveDates) {
        date = item.date;
      } else if (generateDates) {
        const year = currentDate.getFullYear();
        const month = String(currentDate.getMonth() + 1).padStart(2, '0');
        const day = String(currentDate.getDate()).padStart(2, '0');
        date = `${year}-${month}-${day}`;
        currentDate.setDate(currentDate.getDate() + 1);
      }

      // Calculate color
      let result;
      if (forceSpaceName === 'auto') {
        result = calculator.calculate(word);
      } else {
        const strategy = getStrategyByName(forceSpaceName);
        if (strategy) {
          result = calculator.calculateWithSpace(word, strategy);
        } else {
          result = calculator.calculate(word);
        }
      }

      const outputItem = {
        date: date,
        word: word,
        hsl: [result.hsl.hue, result.hsl.saturation, result.hsl.lightness]
      };
      output.push(outputItem);

      // Update progress
      const percent = Math.floor((i + 1) / entries.length * 100);
      const progressBar = document.getElementById('progress-bar');
      const progressText = document.getElementById('progress-text');
      if (progressBar) progressBar.value = percent;
      if (progressText) progressText.textContent = `${i + 1} / ${entries.length}`;

      // Yield to UI
      if (i % 100 === 0) {
        await new Promise(resolve => setTimeout(resolve, 0));
      }
    }

    return output;
  }

  // Show preview
  function showPreview(output) {
    const previewDiv = document.getElementById('preview');
    const previewContent = document.getElementById('preview-content');
    const statsDiv = document.getElementById('stats');

    if (!output.length) {
      previewDiv.style.display = 'none';
      statsDiv.style.display = 'none';
      return;
    }

    // Preview first 5
    const preview = output.slice(0, 5);
    previewContent.textContent = JSON.stringify(preview, null, 2);
    previewDiv.style.display = 'block';

    // Stats
    const uniqueWords = new Set();
    const spaceCounts = {};
    for (const item of output) {
      uniqueWords.add(item.word);
    }
    statsDiv.innerHTML = `
      <strong>Statistics:</strong><br>
      Total entries: ${output.length}<br>
      Unique words: ${uniqueWords.size}<br>
    `;
    statsDiv.style.display = 'block';
  }

  // Handle file selection
  document.getElementById('json-file').addEventListener('change', (e) => {
    const file = e.target.files[0];
    if (!file) {
      document.getElementById('process-btn').disabled = true;
      return;
    }

    const reader = new FileReader();
    reader.onload = (event) => {
      try {
        currentEntries = JSON.parse(event.target.result);
        if (!Array.isArray(currentEntries)) {
          alert('JSON must be an array of objects with at least a "word" field.');
          currentEntries = [];
          document.getElementById('process-btn').disabled = true;
          return;
        }
        // Basic validation
        for (const item of currentEntries) {
          if (!item.word) {
            alert('Each entry must have a "word" field.');
            currentEntries = [];
            document.getElementById('process-btn').disabled = true;
            return;
          }
        }
        document.getElementById('process-btn').disabled = false;
      } catch (err) {
        alert('Invalid JSON: ' + err.message);
        currentEntries = [];
        document.getElementById('process-btn').disabled = true;
      }
    };
    reader.readAsText(file);
  });

  // Process button
  document.getElementById('process-btn').addEventListener('click', async () => {
    if (!currentEntries.length) return;

    const forceSpaceName = document.getElementById('force-space').value;
    const generateDates = document.getElementById('generate-dates').checked;
    const preserveDates = document.getElementById('preserve-dates').checked;
    const startDate = document.getElementById('start-date').value;

    // Show progress area
    document.getElementById('progress-area').style.display = 'block';
    document.getElementById('download-btn').disabled = true;
    document.getElementById('preview').style.display = 'none';
    document.getElementById('stats').style.display = 'none';

    currentOutput = await processEntries(currentEntries, forceSpaceName, startDate, generateDates, preserveDates);

    // Hide progress, show preview and download button
    document.getElementById('progress-area').style.display = 'none';
    showPreview(currentOutput);
    document.getElementById('download-btn').disabled = false;
  });

  // Download button
  document.getElementById('download-btn').addEventListener('click', () => {
    if (!currentOutput || !currentOutput.length) return;

    const json = JSON.stringify(currentOutput, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    const today = new Date().toISOString().slice(0, 19).replace(/:/g, '-');
    a.download = `dwd_batch_${today}.json`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  });
</script>
</body>
</html>
